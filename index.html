<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T5 Filter Tag Controller</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --success-color: #10b981;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 16px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 420px;
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); box-sizing: border-box;
        }
        h1 { font-size: 1.25rem; margin-top: 0; text-align: center; font-weight: 600; }
        .status-badge { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background-color: #ef4444; }
        .dot.connected { background-color: var(--success-color); }
        
        .field-block { background: #252525; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 14px; }
        label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; font-weight: bold; }
        input[type="text"] {
            width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid var(--border-color);
            border-radius: 6px; color: var(--text-main); font-size: 0.95rem; box-sizing: border-box; outline: none; margin-bottom: 8px;
        }
        .presets-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .preset-btn { background: #333; border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 2px; font-size: 0.7rem; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .preset-btn:hover { background: var(--accent-color); border-color: var(--accent-color); }
        
        .action-btn { width: 100%; background: var(--accent-color); color: white; border: none; padding: 14px; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .action-btn:hover { background: var(--accent-hover); }
    </style>
</head>
<body>
    <div class="container">
        <h1>T5 Filter Tag</h1>
        <div class="status-badge">
            <span id="statusDot" class="dot"></span>
            <span id="statusText">Ikke forbundet</span>
        </div>

        <!-- Filter 1 -->
        <div class="field-block">
            <label>Top Linje (Filter 1)</label>
            <input type="text" id="line1" value="ND 0.3 (1 Stop)">
            <div class="presets-grid">
                <button class="preset-btn" onclick="setVal('line1', 'ND 0.3 (1 Stop)')">0.3</button>
                <button class="preset-btn" onclick="setVal('line1', 'ND 0.6 (2 Stops)')">0.6</button>
                <button class="preset-btn" onclick="setVal('line1', 'ND 0.9 (3 Stops)')">0.9</button>
                <button class="preset-btn" onclick="setVal('line1', 'ND 1.2 (4 Stops)')">1.2</button>
                <button class="preset-btn" onclick="setVal('line1', 'ND 1.8 (6 Stops)')">1.8</button>
                <button class="preset-btn" onclick="setVal('line1', 'ND 3.0 (10 Stops)')">3.0</button>
                <button class="preset-btn" onclick="setVal('line1', 'POLA')">POLA</button>
                <button class="preset-btn" onclick="setVal('line1', '-')">Tom</button>
            </div>
        </div>

        <!-- Filter 2 -->
        <div class="field-block">
            <label>Midterste Linje (Filter 2)</label>
            <input type="text" id="line2" value="ND 0.6 (2 Stops)">
            <div class="presets-grid">
                <button class="preset-btn" onclick="setVal('line2', 'ND 0.3 (1 Stop)')">0.3</button>
                <button class="preset-btn" onclick="setVal('line2', 'ND 0.6 (2 Stops)')">0.6</button>
                <button class="preset-btn" onclick="setVal('line2', 'ND 0.9 (3 Stops)')">0.9</button>
                <button class="preset-btn" onclick="setVal('line2', 'ND 1.2 (4 Stops)')">1.2</button>
                <button class="preset-btn" onclick="setVal('line2', 'ND 1.8 (6 Stops)')">1.8</button>
                <button class="preset-btn" onclick="setVal('line2', 'ND 3.0 (10 Stops)')">3.0</button>
                <button class="preset-btn" onclick="setVal('line2', 'POLA')">POLA</button>
                <button class="preset-btn" onclick="setVal('line2', '-')">Tom</button>
            </div>
        </div>

        <!-- Filter 3 -->
        <div class="field-block">
            <label>Bund Linje (Filter 3)</label>
            <input type="text" id="line3" value="ND 0.9 (3 Stops)">
            <div class="presets-grid">
                <button class="preset-btn" onclick="setVal('line3', 'ND 0.3 (1 Stop)')">0.3</button>
                <button class="preset-btn" onclick="setVal('line3', 'ND 0.6 (2 Stops)')">0.6</button>
                <button class="preset-btn" onclick="setVal('line3', 'ND 0.9 (3 Stops)')">0.9</button>
                <button class="preset-btn" onclick="setVal('line3', 'ND 1.2 (4 Stops)')">1.2</button>
                <button class="preset-btn" onclick="setVal('line3', 'ND 1.8 (6 Stops)')">1.8</button>
                <button class="preset-btn" onclick="setVal('line3', 'ND 3.0 (10 Stops)')">3.0</button>
                <button class="preset-btn" onclick="setVal('line3', 'POLA')">POLA</button>
                <button class="preset-btn" onclick="setVal('line3', '-')">Tom</button>
            </div>
        </div>

        <button class="action-btn" id="connectBtn" onclick="connectAndUpload()">Forbind & Upload</button>
    </div>

    <script>
        const SERVICE_UUID = "5fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHAR_UUID_1 = "ceb5483e-36e1-4688-b7f5-ea07361b26a1";
        const CHAR_UUID_2 = "ceb5483e-36e1-4688-b7f5-ea07361b26a2";
        const CHAR_UUID_3 = "ceb5483e-36e1-4688-b7f5-ea07361b26a3";

        let bluetoothDevice = null;

        function setVal(fieldId, val) {
            document.getElementById(fieldId).value = val;
        }

        async function connectAndUpload() {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const connectBtn = document.getElementById('connectBtn');

            const l1 = document.getElementById('line1').value;
            const l2 = document.getElementById('line2').value;
            const l3 = document.getElementById('line3').value;

            try {
                if (!bluetoothDevice || !bluetoothDevice.gatt.connected) {
                    statusText.innerText = "Søger...";
                    bluetoothDevice = await navigator.bluetooth.requestDevice({
                        filters: [{ namePrefix: "T5" }],
                        optionalServices: [SERVICE_UUID]
                    });
                    bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
                    
                    statusText.innerText = "Forbinder...";
                    const server = await bluetoothDevice.gatt.connect();
                    const service = await server.getPrimaryService(SERVICE_UUID);

                    window.char1 = await service.getCharacteristic(CHAR_UUID_1);
                    window.char2 = await service.getCharacteristic(CHAR_UUID_2);
                    window.char3 = await service.getCharacteristic(CHAR_UUID_3);

                    statusDot.classList.add('connected');
                    statusText.innerText = "Forbundet!";
                }

                connectBtn.innerText = "Uploader...";
                const encoder = new TextEncoder();

                await window.char1.writeValue(encoder.encode(l1));
                await window.char2.writeValue(encoder.encode(l2));
                await window.char3.writeValue(encoder.encode(l3));

                bluetoothDevice.gatt.disconnect();

                connectBtn.innerText = "Upload færdig! ✓";
                setTimeout(() => { connectBtn.innerText = "Forbind & Upload"; }, 2500);

            } catch (error) {
                console.error(error);
                statusText.innerText = "Fejl / Afbrudt";
                statusDot.classList.remove('connected');
                connectBtn.innerText = "Forbind & Upload";
            }
        }

        function onDisconnected() {
            document.getElementById('statusDot').classList.remove('connected');
            document.getElementById('statusText').innerText = "Ikke forbundet";
        }
    </script>
</body>
</html>
